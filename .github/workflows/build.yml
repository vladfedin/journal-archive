name: Test and build desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,package]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python packaging/build.py
      - run: python packaging/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: LiveJournalArchive-${{ matrix.os }}
          path: |
            release/*
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

name: Test and build desktop packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
jobs:
  package:
    name: package (${{ matrix.os }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64.tar.gz
          - os: windows-2022
            platform: windows-x64.exe
          - os: macos-15
            platform: macos-arm64.zip
          - os: macos-15-intel
            platform: macos-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,package]"
      - name: Run tests
        shell: python {0}
        run: |
          import subprocess
          import sys
          result = subprocess.run([sys.executable, '-m', 'pytest', '-q', '--junitxml=test-results/pytest.xml'],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                  encoding='utf-8', errors='replace')
          print(result.stdout)
          if result.returncode:
              output = result.stdout[-40000:]
              print('::error::' + output.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          sys.exit(result.returncode)
      - name: Annotate test failures
        if: failure()
        shell: python {0}
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('test-results/pytest.xml')
          if report.exists():
              def escape(text):
                  return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              for case in ET.parse(report).iter('testcase'):
                  for issue in case:
                      if issue.tag in ('failure', 'error'):
                          print('::error::' + escape(case.get('name', '') + '\n' + (issue.text or issue.get('message', ''))))
      - name: Install browser test tools
        if: runner.os == 'Linux'
        run: |
          python -m pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Check browser interface
        if: runner.os == 'Linux'
        shell: python {0}
        run: |
          import subprocess
          import sys
          for script in ('tests/browser_smoke.py', 'tests/browser_calendar.py', 'tests/browser_image_recovery.py'):
              result = subprocess.run([sys.executable, script],
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      encoding='utf-8', errors='replace')
              print(result.stdout)
              if result.returncode:
                  print('::error::' + result.stdout.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
                  sys.exit(result.returncode)
      - run: python -m build
      - run: python packaging/build.py
      - name: Check native application
        shell: python {0}
        run: |
          import subprocess
          import sys
          result = subprocess.run([sys.executable, 'packaging/smoke.py'],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                  encoding='utf-8', errors='replace')
          print(result.stdout)
          if result.returncode:
              message = result.stdout.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + message)
          sys.exit(result.returncode)
      - uses: actions/upload-artifact@v4
        with:
          name: LiveJournalArchive-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

      - name: Publish this platform
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/publish.py --platform "${{ matrix.platform }}"

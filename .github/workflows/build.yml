name: Test and build desktop packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,package]"
      - run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Annotate test failures
        if: failure()
        shell: python {0}
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('test-results/pytest.xml')
          if report.exists():
              def escape(text):
                  return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              for case in ET.parse(report).iter('testcase'):
                  for issue in case:
                      if issue.tag in ('failure', 'error'):
                          print('::error::' + escape(case.get('name', '') + '\n' + (issue.text or issue.get('message', ''))))
      - name: Install browser test tools
        if: runner.os == 'Linux'
        run: |
          python -m pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Check browser interface
        if: runner.os == 'Linux'
        shell: python {0}
        run: |
          import subprocess
          import sys
          result = subprocess.run([sys.executable, 'tests/browser_smoke.py'],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                  encoding='utf-8', errors='replace')
          print(result.stdout)
          if result.returncode:
              print('::error::' + result.stdout.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          sys.exit(result.returncode)
      - run: python -m build
      - run: python packaging/build.py
      - name: Check native application
        shell: python {0}
        run: |
          import subprocess
          import sys
          result = subprocess.run([sys.executable, 'packaging/smoke.py'],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                  encoding='utf-8', errors='replace')
          print(result.stdout)
          if result.returncode:
              message = result.stdout.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + message)
          sys.exit(result.returncode)
      - uses: actions/upload-artifact@v4
        with:
          name: LiveJournalArchive-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LiveJournalArchive-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/publish.py

name: Publish ready release packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ready.yml'
      - 'packaging/publish.py'
      - 'packaging/recover_release.py'
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-ready-packages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication logic
        run: python -m unittest discover -s tests -p test_release_publish.py
      - name: Publish verified packages of the version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/recover_release.py

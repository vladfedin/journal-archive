[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livejournal-local-archive"
version = "0.4.1"
description = "Локальный архив Живого Журнала с комментариями и поиском"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "requests>=2.32,<3",
  "bleach>=6.2,<7",
  "defusedxml>=0.7,<1",
  "Jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
browser = ["playwright>=1.50,<2"]
package = ["pyinstaller>=6.16,<7", "build>=1.2,<2"]

[project.scripts]
lj-archive = "ljarchive.__main__:main"

[project.gui-scripts]
lj-archive-desktop = "ljarchive.desktop:main"

[tool.setuptools.package-data]
ljarchive = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/*.ico"]

[tool.setuptools.packages.find]
include = ["ljarchive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


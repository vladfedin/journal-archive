{% macro show_userpic(pic, user, prefix='../', cls='') -%}
{% if pic and pic.path %}{% set assumed = pic.selection == 'assumed_default' %}<a class="userpic-link {{ cls }}{% if assumed %} userpic-assumed{% endif %}" href="{{ prefix }}{{ pic.path }}" title="{% if assumed %}Основной юзерпик: какой был выбран, ЖЖ не сообщил{% else %}{{ pic.keyword or user }}{% endif %}"><img class="userpic" src="{{ prefix }}{{ pic.path }}" alt="Юзерпик {{ user }}{% if pic.keyword and not assumed %}: {{ pic.keyword }}{% endif %}" loading="lazy"></a>{% elif pic and pic.selection == 'unknown' %}<span class="userpic-link userpic-unknown {{ cls }}" title="Какой юзерпик был выбран, ЖЖ не сообщил"><span class="userpic"></span></span>{% endif %}
{%- endmacro %}

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Архивы · Архив ЖЖ</title><link rel="icon" href="/static/favicon.ico" sizes="16x16 32x32 48x48"><link rel="icon" href="/static/favicon.svg" type="image/svg+xml" sizes="any"><link rel="stylesheet" href="/static/archive.css"><script src="/static/theme.js"></script><script defer src="/static/common.js"></script><script defer src="/static/timeline.js"></script><script defer src="/static/app.js"></script></head><body data-page="library">
<header class="header"><div class="header-inner"><a class="brand" href="/"><span class="mark" data-icon="archive"></span>Архив ЖЖ</a><nav class="nav" aria-label="Разделы"><a href="/" aria-current="page">Архивы</a><a href="/help">Помощь</a><button class="icon" id="theme-toggle" aria-label="Тёмная тема" hidden><span></span></button></nav></div></header>
<main class="main">
<div class="heading"><h1>Архивы</h1><button class="btn primary" data-new><span data-icon="plus"></span>Новый архив</button></div>
<section class="job" id="job" hidden aria-live="polite">
<div class="job-top"><div><strong id="job-title"></strong><span class="job-stage" id="job-stage"></span></div><a class="small muted" id="job-report" hidden>Подробности</a></div>
<div id="job-timeline" class="timeline" hidden></div>
<progress id="progress" aria-label="Ход загрузки"></progress>
<div class="job-bottom"><div class="job-counts mono"><span><b id="posts-count">0</b> записей</span><span><b id="comments-count">0</b> комментариев</span><span id="requests-count">0 запросов</span></div><div class="job-buttons"><a class="btn" id="open-result" hidden>Открыть</a><button class="btn" id="job-action">Остановить</button></div></div>
<p id="job-message" class="job-note" hidden></p></section>
<p id="app-error" class="notice" role="alert" hidden></p>
<div id="empty" class="empty" hidden><p>Архивов пока нет</p><button class="btn" data-new><span data-icon="plus"></span>Новый архив</button></div>
<table class="library" id="library" hidden><thead><tr><th scope="col">Журнал</th><th scope="col">Записи</th><th scope="col">Комментарии</th><th scope="col">Обновлён</th><th scope="col">Статус</th><th scope="col"><span class="sr-only">Действия</span></th></tr></thead><tbody id="archives"></tbody></table>
<p class="storage"><span data-icon="folder"></span><code id="output-path"></code></p>
</main><footer class="footer"><span>Архив ЖЖ · 0.6.1</span><button class="btn text" type="button" id="quit">Завершить приложение</button></footer>
<dialog id="export-dialog" class="dialog" aria-labelledby="dialog-title"><form id="export-form">
<div class="dialog-head"><h2 id="dialog-title">Новый архив</h2><button class="icon" type="button" data-close aria-label="Закрыть"><span data-icon="x"></span></button></div>
<div class="form-grid" id="credentials"><div class="field" id="username-field"><label for="username">Пользователь ЖЖ</label><input class="input" id="username" placeholder="username" autocomplete="username" spellcheck="false" autocapitalize="none" required maxlength="15" pattern="[A-Za-z0-9_\-]{1,15}"></div><div class="field"><label for="password">Пароль</label><div class="password-input"><input class="input" type="password" id="password" autocomplete="current-password" required maxlength="1024"><button class="icon" type="button" id="show-password" aria-label="Показать пароль"><span data-icon="eye"></span></button></div></div></div>
<div id="scope-fields"><div class="segmented" role="group" aria-label="Что загрузить"><button aria-pressed="true" type="button" data-scope="full">Весь журнал</button><button aria-pressed="false" type="button" data-scope="period">За период</button><button aria-pressed="false" type="button" data-scope="latest">Тест <span class="scope-wide">(последние 10 записей)</span><span class="scope-narrow">· 10 записей</span></button><button aria-pressed="false" type="button" data-scope="urls" hidden>По ссылкам</button></div>
<div id="period-fields" class="form-grid" hidden><div class="field"><label for="date-from">С</label><input class="input" type="date" id="date-from" ></div><div class="field"><label for="date-to">По</label><input class="input" type="date" id="date-to" ></div></div>
<div class="field" id="url-fields" hidden><label for="entry-urls">Ссылки на записи или комментарии</label><textarea id="entry-urls" placeholder="https://username.livejournal.com/12345.html" spellcheck="false"></textarea></div>
<label class="check"><input type="checkbox" id="account" checked>Профиль, друзья, настройки, юзерпики</label>
<label class="check"><input type="checkbox" id="messages">Личная переписка</label>
<label class="check"><input type="checkbox" id="images">Скачать изображения</label>
<details class="form-advanced"><summary>Настройки загрузки</summary><div class="form-grid"><div class="field"><label for="request-limit">Лимит запросов</label><input class="input" type="number" id="request-limit" placeholder="Без лимита" min="1" max="10000"></div><div class="field"><label for="delay">Пауза, сек.</label><input class="input" type="number" id="delay" value="3" min="1" max="60"></div></div></details></div>
<p id="resume-note" class="form-note" hidden></p>
<p id="form-error" class="notice" role="alert" hidden></p><div class="dialog-actions"><a href="/help#limits" target="_blank" rel="noopener" class="limit-caption">Помощь</a><div class="dialog-buttons"><button class="btn" type="button" data-close>Отмена</button><button class="btn primary" type="submit" id="submit-export">Создать</button></div></div>
</form></dialog><div id="toast" class="toast" role="status" hidden></div></body></html>
